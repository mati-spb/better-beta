ugh location and activity recognition), even when the app is closed. Your home location is saved only on the phone.",measuredPlacesSilent:"• When you are at home, at work or driving (through location and activity recognition), even when the app is closed. Your home location is saved only on the phone: Google location services on the phone use it to wake the app when you get home or leave.",measuredUsage:"• Only if you allow “Usage access” (optional): which app is open while you drive, so navigation apps don’t count as use. Also, for any stretch when monitoring wasn’t running (for example after a restart), the app checks afterward whether the phone was in use. App names never leave the phone.",measuredUsageSilent:"• Only if you allow “Usage access” (optional): which app is open while you drive, so navigation apps don’t count as use. Also, for any stretch when monitoring wasn’t running (for example after a restart, or while “{setting}” is off), the app checks afterward whether the phone was in use. App names never leave the phone.",measuredNotif:"• “{setting}” is used only so {brand} can keep running in the background with no ongoing notification and no icon in the status bar. {brand} doesn’t read, save or send any notifications. While you drive, Android may show its own location icon; the app doesn’t control that.",sentTitle:"What is sent to the server",sentData:"The times of your breaks, the context label (home, work, driving, standard or sleep) and the minutes in each context, whether the phone was in use and what ended the break (unlock, call or app use), and a daily summary of screen time and unlocks.",sentTech:"Technical details are also sent: the name and email of your Google account, the app version, a random device ID, the time zone, the permission and monitoring status, and whether home and work are saved (yes or no, no location).",neverTitle:"What is never sent",never:"Names of Bluetooth devices (like your car), names of Wi‑Fi networks, app names and your exact location. They never leave the phone. Notifications aren’t read or sent either.",who:"Only you and the beta admin see the data. You can limit measuring through Android (turn off location or activity recognition), or stop it completely by uninstalling the app.",agree:"I agree to the monitoring and to sending the data as described here",accept:"Agree and continue",notNow:"Not now"},perms:{title:"A few approvals, just once",intro:"From here on, {brand} measures on its own. Each button opens an Android screen; after you approve, come back here.",nextAnyway:"Continue for now"},updates:{title:"Automatic updates",intro:"Recommended, not required. New versions of {brand} arrive on their own, with no need to download them from the browser again. You can skip this and allow it later in Settings, under “Updates”."},usage:{title:"One more thing (optional)",intro:"Screen and lock monitoring needs no permission. You can add usage access now, or skip and come back to it later from Settings.",introNotifOff:"Screen and lock monitoring starts once you turn on “{setting}” (in the approvals step). You can add usage access now, or skip and come back to it later from Settings.",skip:"Skip for now (screen monitoring on)",skipNotifOff:"Skip for now (screen measured after “{setting}”)"},places:{title:"Your places",intro:"At home, every minute without your phone counts double. You can save your places now, or let {brand} learn them on its own."},start:{title:"All set",intro:"From now on, monitoring is automatic. Put the phone down, and every 15 minutes in a row without unlocking it counts. Opening {brand} also counts as using the phone.",notifOffUsage:"Without “{setting}”, measuring doesn’t run in the background and breaks are only checked afterward. You can turn it on in the approvals step or in Settings.",notifOff:"Without “{setting}”, measuring doesn’t work and breaks aren’t counted. You can turn it on in the approvals step or in Settings.",missing:"Some approvals are still missing,
